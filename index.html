<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Keep the Pages site out of search results; the public repo is listed on
     the GitHub profile regardless, but nobody needs to land here from Google. -->
<meta name="robots" content="noindex">
<title>Woodshed</title>
<style>
  :root { --bg: #111; --ink: #ddd; --dim: #888; --brass: #d9a441; --line: #333; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 390px; margin: 0 auto; padding: 16px;
         display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font: 20px Georgia, serif; color: var(--dim); }
  #status { font-size: 14px; color: var(--dim); }
  #status[data-state="connected"] { color: var(--ink); }
  #note { font: 120px/1 Georgia, serif; color: var(--brass); text-align: center;
          padding: 24px 0 8px; }
  #raw { text-align: center; font-size: 13px; color: var(--dim);
         font-variant-numeric: tabular-nums; min-height: 1.4em; }
  #hint { text-align: center; font-size: 14px; min-height: 2.8em; }
  .buttons { display: flex; gap: 8px; }
  button { flex: 1; padding: 14px; font: inherit; color: var(--ink);
           background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  button.active { border-color: var(--brass); color: var(--brass); }
</style>
</head>
<body>
<main>
  <h1>Woodshed</h1>
  <div id="status">Connecting…</div>
  <div id="note">—</div>
  <div id="raw"></div>
  <div id="hint"></div>
  <div class="buttons">
    <button id="calibrate">Calibrate</button>
    <button id="connect" hidden>Connect horn</button>
  </div>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
