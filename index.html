<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: in full-screen landscape the camera hole sits on a
     side edge; the layout pads itself with the safe-area insets instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Keep the Pages site out of search results; the public repo is listed on
     the GitHub profile regardless, but nobody needs to land here from Google. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<!-- Declares the page already dark, so Chrome's "auto dark mode for web"
     leaves its colours alone — it was repainting the dark degree number
     white on the brass disc. -->
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Woodshed</title>
<style>
  /* Both fonts subset by tools/subset_font.py. RealBook: note letters and
     digits, minus, ø. WSymbols (DejaVu Serif Bold): ♭ ♯ △ — shipped so every device
     renders the same glyphs the spacing was tuned against. */
  @font-face { font-family: 'RealBook'; src: url(fonts/realbook.woff2) format('woff2');
               font-display: swap; }
  @font-face { font-family: 'WSymbols'; src: url(fonts/symbols.woff2) format('woff2');
               font-weight: 700; font-display: swap; }
  :root { color-scheme: dark; --bg: #111; --ink: #ddd; --dim: #888; --brass: #d9a441; --line: #333;
          --pad: 16px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif;
         overflow: hidden; }

  /* Landscape only (target: 844 × 390 installed full screen). Question on
     the left, controls in a fixed-width column on the right. */
  main { height: 100dvh; display: grid; grid-template-columns: 1fr 280px; gap: var(--pad);
         padding: 12px max(var(--pad), env(safe-area-inset-right))
                  12px max(var(--pad), env(safe-area-inset-left)); }

  /* The question. Fixed heights so nothing jumps between questions. */
  .drill { position: relative; display: flex; flex-direction: column; justify-content: center;
           align-items: center; text-align: center; min-width: 0; }
  #progress { font-size: 14px; color: var(--dim); min-height: 1.4em;
              font-variant-numeric: tabular-nums; }
  .question { display: flex; align-items: center; justify-content: center; gap: 36px;
              min-height: 160px; }
  /* The chord is the big thing; the degree is a smaller, plainly lettered
     token beside it, so the two never read as one symbol. */
  #chord { font: 140px/1.1 'RealBook', Georgia, serif; min-height: 1.1em; }   /* idle: empty, keeps its space */
  #degree { width: 96px; height: 96px; flex: none; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--brass); color: var(--bg);
            font: 700 58px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #degree:empty { visibility: hidden; }   /* idle: keep the space, hide the disc */
  /* Practice miss: the disc turns red and flips to show the right note.
     Learn miss: it flashes red and stays on the degree. */
  #degree.reveal { background: #d65a5a; font-size: 40px; animation: flip .35s ease-out; }
  #degree.miss { animation: miss-flash .5s ease-out; }
  @keyframes miss-flash { 25% { background: #d65a5a; transform: scale(1.08); } }
  @keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }

  /* --- Feedback effects (drill.js) --- */
  /* Radial glow behind the question. */
  #fx { position: absolute; inset: -12px; pointer-events: none; opacity: 0; }
  #fx.good { background: radial-gradient(circle at 50% 50%, rgba(244,195,122,.35), transparent 62%);
             animation: glow .6s ease-out; }
  #fx.bad { background: radial-gradient(circle at 50% 50%, rgba(214,70,70,.4), transparent 62%);
            animation: glow .6s ease-out; }
  @keyframes glow { from { opacity: 1; } to { opacity: 0; } }
  .question.shake { animation: shake .34s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-14px); }
    40% { transform: translateX(11px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); } }

  /* Burst from the degree disc (drill.js): right = brass flash that blasts
     outward with a ring shockwave; wrong = red burst that shakes and fades. */
  .burst { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px;
           border-radius: 50%; pointer-events: none; z-index: 2; }
  .burst.good { background: radial-gradient(circle, rgba(255,236,190,.95) 0%,
                  rgba(244,195,122,.7) 35%, rgba(244,195,122,0) 70%);
                animation: blast .5s cubic-bezier(.1,.7,.3,1) forwards; }
  .burst.good::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
                       border: 5px solid #ffe2a8; box-shadow: 0 0 16px #f4c37a;
                       animation: ring .6s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes blast { from { transform: scale(.7); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
  @keyframes ring { from { transform: scale(1); opacity: 1; }
                    to { transform: scale(3.2); opacity: 0; border-width: 1px; } }
  .burst.bad { background: radial-gradient(circle, rgba(255,120,120,.9) 0%,
                 rgba(214,70,70,.6) 40%, rgba(214,70,70,0) 70%);
               animation: blast-bad .55s ease-out forwards; }
  @keyframes blast-bad {
    0% { transform: translateX(0) scale(.9); opacity: 1; }
    20% { transform: translateX(-14px) scale(1.4); }
    40% { transform: translateX(12px) scale(1.6); }
    60% { transform: translateX(-8px) scale(1.7); opacity: .7; }
    80% { transform: translateX(4px) scale(1.8); }
    100% { transform: translateX(0) scale(1.9); opacity: 0; } }
  /* Right note floating up out of the disc (drill.js floatNote). */
  .float-note { position: absolute; z-index: 3; pointer-events: none; opacity: 0;
                font: 800 26px/1 system-ui, sans-serif; color: #ffe2a8;
                text-shadow: 0 0 12px rgba(244,195,122,.9), 0 0 3px #000; white-space: nowrap; }
  /* The disc gives a quick pulse on a right answer. */
  #degree.pulse { animation: pulse .3s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  /* Label under the question: time + speed, or the note played. */
  #feedback b { display: block; font: 800 30px/1.1 system-ui, sans-serif;
                font-variant-numeric: tabular-nums; }
  #feedback small { display: block; font: 700 12px/1.6 system-ui, sans-serif;
                    letter-spacing: .14em; text-transform: uppercase; }
  #feedback.fb-good { color: #ffe2a8; text-shadow: 0 0 14px rgba(244,195,122,.6);
                      animation: label-pop .3s cubic-bezier(.2,.9,.3,1.5); }
  #feedback.fb-bad { color: #ff9b9b; animation: shake .34s; }
  @keyframes label-pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .burst, .burst::after, .question.shake, #degree.reveal, #degree.pulse, #degree.miss,
    #feedback.fb-good, #feedback.fb-bad { animation-duration: .01s; }
  }
  #feedback { font-size: 20px; min-height: 2.8em; padding-top: 4px; }

  /* Real Book notation (notation.js). Letters/digits in the Real Book font;
     accidentals and quality symbols in the bundled WSymbols face, sized and
     raised relative to the letter. Tuned against tools/notation_sheet.js,
     which renders exactly what the phone does (docs/notation.md). */
  .rb { font-family: 'RealBook', Georgia, serif; }
  /* The ♭ ♯ △ glyphs are thin next to the Real Book strokes and the – ø 7;
     a same-colour outline thickens them (no heavier weight exists). */
  .acc, .q-maj7 { -webkit-text-stroke: .045em currentColor; }
  .acc { font-family: 'WSymbols', serif; font-size: .72em; vertical-align: .3em; font-weight: 700; }
  .acc-s { margin-left: .02em; margin-right: .02em; }
  .acc-f { margin-left: 0; margin-right: -.02em; }   /* the flat's bowl has extra side-bearing */
  .q { font-family: 'WSymbols', serif; font-weight: 700; margin-left: .02em; }
  .rb + .q { margin-left: .14em; }   /* no accidental: give the letter room */
  .acc + .q { margin-left: .1em; }   /* the stroked accidental needs a gap too */
  .q-maj7 { font-size: .5em; vertical-align: .65em; }   /* centred with the accidentals */
  .q-7 { font-family: 'RealBook', Georgia, serif; font-weight: 400; font-size: .62em; vertical-align: .24em; }
  /* Minus and ø are the Real Book font's own hand-drawn chord symbols. The
     font draws ø as a raised superscript, so it's pulled down to centre
     alongside the △ and accidentals; the minus gets a small lift. */
  .q-m7, .q-m7b5 { font-family: 'RealBook', serif; font-weight: 400; }
  .q-m7 { font-size: .9em; vertical-align: .06em; }
  .q-m7b5 { font-size: .9em; vertical-align: -.24em; }   /* glyph sits high in the font: pull down to centre */
  .rb + .q-m7, .acc + .q-m7, .rb + .q-m7b5, .acc + .q-m7b5 { margin-left: .04em; }

  /* Controls. */
  .panel { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { margin: 0; font: 18px Georgia, serif; color: var(--dim); }
  /* Wraps rather than truncating: error states carry the fix in the text. */
  #status { font-size: 12px; color: var(--dim); text-align: right; }
  #status[data-state="connected"] { color: var(--ink); }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 10px; font: inherit; color: var(--ink);
           background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  button.active { border-color: var(--brass); color: var(--brass); }
  button:disabled { opacity: 0.4; }
  #start, #stop { font-size: 18px; padding: 14px; }

  /* ⚙ button and the backup panel (A7). */
  #menuBtn { flex: none; padding: 2px 8px; font-size: 16px; border: none; color: var(--dim); }
  #menu { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.7);
          display: flex; align-items: center; justify-content: center; }
  #menu[hidden] { display: none; }
  #menu .sheet { width: min(460px, 92vw); background: #1a1a1a; border: 1px solid var(--line);
                 border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #menu h2 { margin: 0; font: 20px Georgia, serif; }
  #menu p { margin: 0; font-size: 14px; }
  #menu .note { color: var(--dim); font-size: 12px; }
  #menuMsg:empty { display: none; }
  #menuMsg.bad { color: #ff9b9b; }

  /* Horn readout and calibration, secondary; pinned to the bottom. */
  .horn { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px;
          display: flex; flex-direction: column; gap: 6px; }
  .played { display: flex; justify-content: space-between; align-items: baseline;
            white-space: nowrap; }
  #note { font: 34px/1 'RealBook', Georgia, serif; color: var(--brass); }
  #raw { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #hint { font-size: 12px; color: var(--dim); min-height: 1.4em; }

  /* Portrait: no layout, just ask for landscape. The installed app is
     locked to landscape by the manifest; this covers a browser tab. */
  #rotate { display: none; }
  @media (orientation: portrait) {
    main { display: none; }
    #rotate { display: flex; height: 100dvh; align-items: center; justify-content: center;
              flex-direction: column; gap: 12px; padding: var(--pad); text-align: center;
              color: var(--dim); }
    #rotate b { font: 48px Georgia, serif; color: var(--brass); }
  }
</style>
</head>
<body>
<div id="rotate"><b>⟳</b>Turn your phone sideways.</div>
<main>
  <section class="drill">
    <div id="fx"></div>
    <div id="progress"></div>
    <div class="question">
      <div id="chord"></div>
      <div id="degree"></div>
    </div>
    <div id="feedback"></div>
  </section>

  <section class="panel">
    <header>
      <h1>Woodshed</h1>
      <div id="status">Connecting…</div>
      <button id="menuBtn" aria-label="Backup">⚙</button>
    </header>
    <div class="row">
      <button data-mode="learn">Learn</button>
      <button data-mode="practice">Practice</button>
    </div>
    <div class="row">
      <button id="pick">Weak spots</button>
      <button id="length">20 questions</button>
    </div>
    <div class="row">
      <button id="start">Start</button>
      <button id="stop" hidden>Stop</button>
    </div>

    <section class="horn">
      <div class="played"><span>You played <span id="note">—</span></span><span id="raw"></span></div>
      <div id="hint"></div>
      <div class="row">
        <button id="calibrate">Calibrate</button>
        <button id="connect" hidden>Connect horn</button>
      </div>
    </section>
  </section>
</main>
<!-- Backup panel (A7), opened by ⚙. -->
<div id="menu" hidden>
  <div class="sheet">
    <h2>Backup</h2>
    <p id="menuCount">…</p>
    <div class="row">
      <button id="saveBackup">Save backup</button>
      <button id="loadBackupBtn">Load backup</button>
      <input id="loadBackup" type="file" accept="application/json,.json" hidden>
    </div>
    <p id="menuMsg"></p>
    <p class="note">Saves every answer and your settings to a file — put it in Drive.
      Loading merges: nothing already here is duplicated or lost.</p>
    <button id="menuClose">Close</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
